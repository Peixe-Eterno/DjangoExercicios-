{% extends 'mycontacts/background.html' %}
{% load static %}
{% block content %}

<div class="container-add">
      <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4 col-xs-offset-3">
        <div class="col-md-6">

            <!-- Card de apresentação -->
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">Detalhes do Contato</h4>
                </div>
                <div class="card-body p-4">

                    <p><strong>Nome:</strong> {{ contact.name }}</p>
                    <p><strong>Relação:</strong> {{ contact.relation }}</p>
                    <p><strong>Telefone:</strong> {{ contact.phone }}</p>
                    <p><strong>Email:</strong> {{ contact.email }}</p>

                </div>

                <div class="card-footer text-center">
                    <a href="{% url '' %}" class="btn btn-secondary">Voltar</a>
                    <a href="{% url 'edit' contact.id %}" class="btn btn-primary">Editar</a>
                </div>
            </div>

        </div>
    </div>
</div>

{% endblock content %}
